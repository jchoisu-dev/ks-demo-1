server {
    listen 443 ssl;
    server_name ak.angri.sr;
    ssl_certificate /etc/nginx/https/angri.sr.crt;
    ssl_certificate_key /etc/nginx/https/angri.sr.key;
    ssl_session_timeout 1m;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    if ($http_origin !~ '^http://localhost\:6723|https://ks-demo-admin.choi-solutions.com')
    {
        return 601;
    }
    if ($request_method !~ ^(GET)$) {
        return 602;
    }
    if ($http_user_agent ~* LWP::Simple|BBBike|wget|curl|spider|Googlebot) {
        return 603;
    }

    set $cors_origin $http_origin;
    add_header Access-Control-Allow-Origin $cors_origin always; 
    add_header Access-Control-Allow-Methods GET always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Headers Authorization always;
    add_header Access-Control-Max-Age 1728000 always;

    location ~* "^/ad_key$" {
        limit_req zone=get_key_zone burst=1;
        proxy_pass http://keys_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        return 404;
    }
}


server {
    listen 443 ssl;
    server_name aw.angri.sr;
    ssl_certificate /etc/nginx/https/angri.sr.crt;
    ssl_certificate_key /etc/nginx/https/angri.sr.key;
    ssl_session_timeout 1m;
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:HIGH:!aNULL:!MD5:!RC4:!DHE;
    ssl_prefer_server_ciphers on;

    if ($http_origin !~ '^http://localhost\:6723|https://ks-demo-admin.choi-solutions.com') 
    {
        return 601;
    }
    if ($request_method !~ ^(GET)$) {
        return 602;
    }
    if ($http_user_agent ~* LWP::Simple|BBBike|wget|curl|spider|Googlebot) {
        return 603;
    }

    location ~* "^/([0-9a-zA-Z]{90,100})$" {
        proxy_pass http://admin;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
    location /favicon.ico {
        return 404;
    }
    location / {
        return 404;
    }
}