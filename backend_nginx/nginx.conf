user root;
worker_processes 6;
worker_cpu_affinity 000001 000010 000100 001000 010000 100000;

worker_rlimit_nofile 65535;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;


events {
    worker_connections  10922;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    server_tokens   off;
    sendfile        off;
    tcp_nopush      on;
    tcp_nodelay     on;

    client_body_buffer_size  1k;
    client_header_buffer_size 1k;
    client_max_body_size 1k;
    large_client_header_buffers 2 1k;

    limit_req_zone $binary_remote_addr zone=lr_zone:100m rate=3r/s;
    limit_req_zone $binary_remote_addr zone=get_key_zone:100m rate=3r/s;
    upstream keys_admin {
        server 127.0.0.1:9201 weight=1 max_fails=20 fail_timeout=2s; 
    }
    upstream keys_web {
        server 127.0.0.1:9101 weight=1 max_fails=2000 fail_timeout=2s; 
        server 127.0.0.1:9101 weight=2 max_fails=4000 fail_timeout=2s; 
        server 127.0.0.1:9101 weight=3 max_fails=6000 fail_timeout=2s;
    }
    upstream web {
        server 127.0.0.1:1001 weight=1 max_fails=3000 fail_timeout=3s;
        server 127.0.0.1:1002 weight=2 max_fails=3000 fail_timeout=3s;
        server 127.0.0.1:1003 weight=3 max_fails=3000 fail_timeout=3s;
        server 127.0.0.1:1004 weight=4 max_fails=3000 fail_timeout=3s;
        server 127.0.0.1:1005 weight=5 max_fails=3000 fail_timeout=3s;
        server 127.0.0.1:1006 weight=6 max_fails=3000 fail_timeout=3s;
        server 127.0.0.1:1007 weight=7 max_fails=3000 fail_timeout=3s;
        server 127.0.0.1:1008 weight=8 max_fails=3000 fail_timeout=3s;
        server 127.0.0.1:1009 weight=9 max_fails=3000 fail_timeout=3s;
        server 127.0.0.1:1010 weight=10 max_fails=3000 fail_timeout=3s;
    }
    upstream admin {
        server 127.0.0.1:9202 weight=1 max_fails=30 fail_timeout=3s;
    }
    include /etc/nginx/conf.d/*.conf;
}
